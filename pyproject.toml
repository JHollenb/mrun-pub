[project]
name = "mrun-pub"
version = "0.1.1"
description = "Portable model execution, bounded-memory runtimes, and guarded fleet scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jake Holl"}]
dependencies = ["numpy>=1.24,<3", "psutil>=5.9", "PyYAML>=6"]

[project.urls]
Repository = "https://github.com/JHollenb/mrun-pub"
Issues = "https://github.com/JHollenb/mrun-pub/issues"

[project.optional-dependencies]
runtime = ["torch>=2.8,<3", "transformers>=4.40,<6", "safetensors>=0.5,<1", "huggingface-hub>=0.23", "requests>=2.31"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
agent = ["nvidia-ml-py>=12; platform_system == 'Linux'"]
cuda = ["mrun-pub[runtime]", "triton>=3; platform_system == 'Linux' and platform_machine == 'x86_64'"]
mlx = ["mrun-pub[runtime]", "mlx>=0.18; platform_system == 'Darwin' and platform_machine == 'arm64'", "mlx-lm>=0.18; platform_system == 'Darwin' and platform_machine == 'arm64'"]
ane = ["mrun-pub[runtime]", "coremltools>=9"]
diffusion = ["mrun-pub[runtime]", "diffusers==0.39.0", "transformers==5.14.1", "accelerate==1.14.0", "Pillow>=10"]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2", "httpx>=0.27"]

[project.scripts]
mrun = "mrun.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrun"]
artifacts = ["src/mrun/server/static/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/scripts", "/examples", "/benchmarks", "/docs", "/deploy", "/README.md", "/AGENTS.md", "/LICENSE", "/NOTICE", "/PROVENANCE.md", "/SOURCE-SNAPSHOT.json", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Preserve extracted numerical programs; source identity takes precedence over cosmetic rewrites.
"src/mrun/engine/kernels/*" = ["F841"]
